[package]
name = "syno-clean"
version = "0.1.0"
edition = "2024"
authors = ["Eduard Macarov <eduard.macarov@trovata.io>"]
description = "Terminal UI for reviewing Synology Download Station tasks and deleting both the task and the files it left on the volume"
license = "MIT"
repository = "https://github.com/Chekushkin/syno-clean"
homepage = "https://github.com/Chekushkin/syno-clean"
documentation = "https://github.com/Chekushkin/syno-clean#readme"
readme = "README.md"
keywords = ["synology", "download-station", "tui", "ratatui", "nas"]
categories = ["command-line-utilities"]
# Not published to crates.io for v1 — release binaries only.
publish = false
exclude = ["docs/plans/", "/.github/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
etcetera = "0.11.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "query", "form"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
