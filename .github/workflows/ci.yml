name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only: CI never writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No toolchain version here on purpose: the action reads the pinned
      # channel out of rust-toolchain.toml, so CI and a local build are the
      # same compiler.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all
